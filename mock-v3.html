<style>

dialog{width:min(490px,calc(100vw - 22px));max-height:min(70vh,450px);padding:12px 15px;border-radius:8px;color:var(--ink);background:var(--paper);border:1px solid var(--line)}dialog::backdrop{background:#191d17a0}.dlist{padding:0;list-style:none}.dlist li{padding:6px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.dlist small{display:block}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.notice{font-size:12px;min-height:0}.notice button{min-height:26px}.compact .notice{padding-top:3px}
@media(max-width:735px){.app{height:auto;min-height:870px}.app[data-size]{height:auto}.layout{grid-template-columns:1fr;grid-template-rows:300px minmax(585px,1fr)}.pane{border-left:0;border-top:1px solid var(--line)}.work{padding:10px}.bar small{display:none}}

<script>
'use strict';
const $=id=>document.getElementById(id), root=$('app');
const ops=['銀髪にしよう','夜にして','逆光はなし','銀髪にしようかなぁ','相談したい','今日はいい天気','銀髪はやめて','タグを作って','光を弱めて','前の案に戻して','生成して','全然違う構図で、キャラも変えたい','新しい絵にしよう'];
const base={light:'逆光・強め',hair:'黒髪',time:'夕暮れ',scene:'山の稜線',color:'落ち着いた色'};
const keyNames={light:'光',hair:'髪',time:'時間帯',scene:'構図',color:'色調'};
const fresh=()=>({memo:[],mu:[],versions:[],log:[],recipe:{...base},history:[],rev:0,staged:null,fromMemo:{},tags:false,expanded:false,count:0,draft:'',notice:null});
const all={general:fresh(),adult:fresh()};let m='general',flow='A',serial=0,timer=0,current=null,adultOk=false,busy=null;
const s=()=>all[m], say=t=>{$('live').textContent=t};
const node=(type,value,cls)=>{let el=document.createElement(type);if(value!=null)el.textContent=value;if(cls)el.className=cls;return el};
const btn=(label,act,cls)=>{const b=node('button',label,cls);b.onclick=act;return b};
const fmt=r=>Object.values(r).filter(Boolean).join(' ／ ');
function frame(){$('sizeHint').textContent=$('size').value==='125'?'実効 1024×576 CSS px':$('size').value==='100'?'1280×720 CSS px':'ブラウザー幅に合わせる'}
$('size').onchange=()=>{root.dataset.size=$('size').value;frame()};
$('theme').onclick=()=>{$('theme').setAttribute('aria-pressed',root.classList.toggle('dark'))};
for(const el of document.querySelectorAll('[data-close]'))el.onclick=()=>$(el.dataset.close).close();
for(const op of ops)$('examples').append(btn(op,()=>{$('examplesD').close();$('input').value=op;$('input').focus()},'tiny'));
$('example').onclick=$('guide').onclick=()=>$('examplesD').showModal();
function notes(){const a=s(),l=$('nList');$('nCount').textContent=a.memo.length;l.replaceChildren();
if(!a.memo.length)l.append(node('li','制作メモはまだありません。'));
for(const n of a.memo){const el=node('li');el.append(node('strong',n.text),node('small','出所：'+n.source));l.append(el)}
$('undoMemo').disabled=!a.mu.length;
$('autoNotice').hidden=!a.notice;if(a.notice)$('autoText').textContent=a.notice}
function stale(a){a.rev++;a.staged=null;foot()}
function memo(key,text,source,notice){const a=s(),other=a.memo.filter(n=>n.key!==key);if(!text&&other.length===a.memo.length)return false;
a.mu.push(a.memo);a.memo=text?[...other,{key,text,source}]:other;a.notice=notice;if(['hair','time','light'].includes(key)){stale(a);a.needsTags=true;}notes();say(notice||'制作メモを更新しました。');return true}
function undoNote(){const a=s();if(!a.mu.length)return;const was=a.memo;a.memo=a.mu.pop();if(['hair','time','light'].some(k=>was.find(n=>n.key===k)!==a.memo.find(n=>n.key===k))){stale(a);a.needsTags=true}if(a.tags&&syncFromMemo())a.log.push({by:'system',text:'生成条件もメモに合わせて戻しました。'});a.notice=null;notes();draw();if($('notesD').open)$('own').focus();else $('notes').focus();say('メモ変更を取り消しました。')}
$('notes').onclick=()=>{notes();$('notesD').showModal()};$('autoUndo').onclick=$('undoMemo').onclick=undoNote;
$('addOwn').onclick=()=>{const v=$('own').value.trim();if(v)memo('own'+ ++serial,v,'自分で入力',null);$('own').value='';$('own').focus()};
const decision=t=>{
const a=t.trim().replace(/[。！!]+$/u,'');
if(/^(銀髪にしよう|銀髪にして|銀髪で決定)$/u.test(a))return ['hair','銀髪にする'];
if(/^(夜にして|夜にしよう|夜で決定)$/u.test(a))return ['time','夜にする'];
if(/^(逆光はなし|逆光なしで|逆光はなしにして)$/u.test(a))return ['light','逆光なし'];
if(/^(銀髪はやめて|銀髪の決定は撤回)$/u.test(a))return ['hair',null];
return null};
function foot(){const a=s();$('jump').hidden=flow!=='A';$('jump').disabled=!!current;$('doB').hidden=flow!=='B';$('doB').disabled=!!busy||!!current||!a.staged;
$('gState').textContent=busy&&busy.mode===m?'模擬生成中…':flow==='A'?'会話のチップで生成を確定。':a.staged?'反映済み · まだ生成していません。':'条件を反映すると生成できます。';
$('count').textContent='模擬生成 '+a.count+'枚';$('art').dataset.result=a.count>0;$('artTitle').textContent=a.count?'霧の尾根 / 習作 '+a.count:'霧の尾根'};
function tagUI(){const a=s(),b=$('tagToggle');b.hidden=!a.tags;b.textContent=a.expanded?'タグを閉じる':'タグを開く';b.setAttribute('aria-expanded',a.expanded);$('tags').hidden=!a.tags||!a.expanded;
$('tagSet').textContent=fmt(a.recipe)}
function tags(open){s().expanded=open;tagUI();(open?$('tagClose'):$('tagToggle')).focus()}
$('tagToggle').onclick=()=>tags(!s().expanded);$('tagClose').onclick=()=>tags(false);
function patch(r){const a=s(),old=a.recipe;if(fmt(old)===fmt(r))return null;
const d={old:{...old},next:{...r},at:a.rev+1};a.history.push({...old});a.recipe={...r};a.rev++;a.staged=null;tagUI();foot();return d}
function previous(){const a=s(),old=a.recipe,last=a.history.pop();if(!last)return null;
const d={old:{...old},next:{...last},at:a.rev+1,restored:true};a.recipe={...last};a.rev++;a.staged=null;tagUI();foot();return d}
function undoPatch(d){const a=s();if(a.rev!==d.at)return;
if(d.restored)a.history.push({...d.next});else a.history.pop();
a.recipe={...d.old};a.rev++;a.staged=null;
if(d.memoLink&&d.memoBefore){a.memo=d.memoBefore.slice();const i=a.mu.lastIndexOf(d.memoBefore);if(i>=0)a.mu.splice(i,1);if(d.fmBefore)a.fromMemo=JSON.parse(JSON.stringify(d.fmBefore));a.notice=null;notes();a.log.push({by:'system',text:'制作メモの決定も取り消しました。'})}
a.log.push({by:'system',text:'条件変更を取り消しました。'});draw(true);tagUI();foot();$('input').focus();say('条件変更を取り消しました。')}
function syncFromMemo(){const a=s(),r={...a.recipe};for(const [k,v] of Object.entries({hair:'銀髪',time:'夜',light:'逆光なし'})){const prior=a.fromMemo[k],wanted=a.memo.some(n=>n.key===k);if(wanted){if(!prior||r[k]!==prior.value)a.fromMemo[k]={before:r[k],value:v};r[k]=v}else if(prior){if(r[k]===prior.value)r[k]=prior.before;delete a.fromMemo[k]}}const d=patch(r);a.needsTags=false;return d}
function applyLarge(turn){const a=s();turn.confirm=null;const fmBefore=JSON.parse(JSON.stringify(a.fromMemo));
memo('scene','構図とキャラを変更（大きな変更）','あなたの決定 · 発言 #'+turn.id,'大きな変更を制作メモに記録しました。');
const memoBefore=a.mu.length?a.mu[a.mu.length-1]:null;
const d=patch({...a.recipe,scene:'湖畔の町並み',color:'鮮やかな色調',hair:'茶髪'});
const t2={by:'ai',text:'大きな変更を生成条件に反映しました。',id:++serial};if(d){d.memoLink=true;d.memoBefore=memoBefore;d.fmBefore=fmBefore;t2.d=d}offer(t2);a.log.push(t2);draw(true);tagUI();foot();say('大きな変更を反映しました。')}
function propose(turn){const a=s();if(turn.rev!==a.rev||turn.used||busy||current)return;
if(flow==='B'){a.staged=turn;draw(true);foot();$('doB').focus();say('条件を反映しました。画像はまだ生成していません。')}
else generate(turn)}
function generate(turn){const a=s();if(!turn||turn.rev!==a.rev||turn.used||busy||current)return;
turn.used=true;a.staged=null;const origin=m;busy={mode:origin};draw(true);foot();$('input').focus();say('模擬生成を開始しました。');
setTimeout(()=>{a.count++;a.log.push({by:'system',text:'模擬生成 '+a.count+'枚目｜'+fmt(turn.recipe)});busy=null;if(m===origin){draw(true);say('模擬生成が完了しました。')}foot()},620)}
$('doB').onclick=()=>generate(s().staged);
function draw(end=false){const a=s(),l=$('log'),y=l.scrollTop;l.replaceChildren();
if(!a.log.length)l.append(node('p','画像を見ながら相談できます。まず「文例」からどうぞ。','muted'));
for(const t of a.log){const row=node('article',null,'msg '+t.by);row.append(node('small',t.by==='user'?'あなた':t.by==='ai'?'プロンプトメーカー':'制作台'));const p=node('p',t.text);if(t===current?.turn)p.id='typing';row.append(p);
if(t.d){const d=t.d,part=node('div',null,'proposal');for(const k in d.old){if(d.old[k]===d.next[k])continue;const line=node('p',keyNames[k]+'：');line.append(node('span',d.old[k],'removed'),' → ',node('span',d.next[k],'added'));part.append(line)}
part.append(node('small',Object.keys(d.old).filter(k=>d.old[k]===d.next[k]).map(k=>keyNames[k]).join('・')+'は変更なし'));
const b=btn(d.memoLink?'条件とメモの変更を取り消す':'条件変更を取り消す',()=>undoPatch(d),'tiny');b.disabled=a.rev!==d.at;part.append(b);row.append(part)}
if(t.confirm){const card=node('div',null,'proposal');card.append(node('p','大きな主題の変更です。構図とキャラクターを含む生成条件を置き換えます。反映しますか？'));
card.append(btn('反映する',()=>applyLarge(t),'primary tiny'),btn('キャンセル',()=>{t.confirm=null;s().log.push({by:'system',text:'大きな変更はキャンセルされました。条件とメモは変更していません。'});draw(true);say('キャンセルしました。')},'tiny'));row.append(card)}
if(t.suggest){const key='ai'+t.id;const b=btn('提案を制作メモに採用',()=>{memo(key,'朝霧を残す案','AI提案を手動採用 · 返信 #'+t.id,null);draw();$('notes').focus()},'tiny');b.disabled=a.memo.some(n=>n.key===key);row.append(b)}
if(t.offer){const o=t.offer,card=node('div',null,'proposal');card.append(node('p',fmt(o.recipe),'tiny'));const label=o.used?'生成を確定済み':o.rev!==a.rev?'条件変更済み':flow==='A'?'この条件で生成しますか · 1枚':a.staged===o?'条件を反映済み':'この条件を反映';const b=btn(label,()=>propose(o),flow==='A'?'primary tiny':'tiny');b.disabled=!!busy||!!current||o.used||o.rev!==a.rev||(flow==='B'&&a.staged===o);b.dataset.offer='yes';card.append(b);row.append(card)}
l.append(row)}
l.scrollTop=end?l.scrollHeight:y}
function offer(t){const a=s();if(!a.tags&&a.needsTags){t.text+=' まだタグは作っていません。「タグを作って」で条件を作成できます。';return}t.offer={recipe:{...a.recipe},rev:a.rev,used:false}}
$('jump').onclick=()=>{const last=[...$('log').querySelectorAll('[data-offer]')].reverse().find(b=>!b.disabled);if(last){last.focus();return}
const t={by:'ai',text:!s().tags&&s().needsTags?'先にタグを作りましょう。':'現在の条件で1枚作りますか？'};offer(t);s().log.push(t);draw(true);if(t.offer)[...$('log').querySelectorAll('[data-offer]')].at(-1).focus();else $('input').focus()};
$('flow').onchange=()=>{flow=$('flow').value;draw();foot()};
function end(stopped=false){const w=current;if(!w)return;clearInterval(timer);current=null;const a=s();
if(stopped)w.turn.text+=(w.turn.text?'\n':'')+'応答を停止しました。';
else if(w.done)w.done(w.turn);
a.versions.push({turn:w.turn.id,memo:a.memo.slice()});
const focused=document.activeElement===$('stop');$('stop').hidden=true;$('send').disabled=false;draw(true);if(focused)$('input').focus();foot();say(stopped?'応答停止':'応答完了')}
$('stop').onclick=()=>end(true);
function send(){if(current)return;const a=s(),raw=$('input').value.trim();if(!raw){$('input').focus();return}
const t=raw.replace(/[。！!]+$/u,''),d=decision(t),id=++serial;let text='朝霧を残すと、稜線の奥行きが伝わりそうです。',done;
$('input').value='';a.log.push({by:'user',text:raw});a.notice=null;notes();
if(d){const [k,v]=d;const added=memo(k,v,'あなたの決定 · 発言 #'+id,v?'制作メモに追加：'+v:'制作メモから撤回：銀髪');
if(added&&a.tags){const memoBefore=a.mu[a.mu.length-1],fmBefore=JSON.parse(JSON.stringify(a.fromMemo));text=v?'制作メモを更新し、生成条件にも自動で反映しました。差分を確認できます。生成はまだ始めません。':'制作メモから撤回し、生成条件も戻しました。生成はまだ始めません。';done=w=>{w.d=syncFromMemo();if(w.d){w.d.memoLink=true;w.d.memoBefore=memoBefore;w.d.fmBefore=fmBefore}else w.text='制作メモを更新しました。生成条件はすでに同じ内容でした。';offer(w)}}
else text=added?'制作メモを更新しました。生成はまだ始めません。':'撤回する項目はありません。'}
else if(t==='タグを作って'||t==='タグを作ってください'){text='いまの案をタグにしました。条件を見て、生成するか決められます。';done=w=>{syncFromMemo();a.needsTags=false;a.tags=true;a.expanded=true;tagUI();offer(w)}}
else if(t==='全然違う構図で、キャラも変えたい'||t==='新しい絵にしよう'){if(a.tags){text='大きな主題の変更として判定しました。生成条件へ反映する前に、一度だけ確認します。';done=w=>{w.confirm=true}}else{memo('scene','全然違う構図で、キャラも変えたい','あなたの決定 · 発言 #'+id,'制作メモに追加：大きな主題の変更');text='制作メモに残しました。まだタグは作っていないので、条件への反映はありません。'}}
else if(t==='光を弱めて'){text='光だけ弱めます。髪・時間帯・構図・色調はそのままです。';done=w=>{w.d=patch({...a.recipe,light:a.recipe.light==='逆光なし'?'柔らかな環境光':'柔らかな光'});if(!w.d)w.text='すでに弱い光です。条件は変更していません。';offer(w)}}
else if(t==='前の案に戻して'){text='ひとつ前の生成条件に戻します。制作メモと生成済み画像はそのままです。';done=w=>{w.d=previous();if(!w.d)w.text='戻せる生成条件はまだありません。';offer(w)}}
else if(t==='生成して'){text='まだ生成していません。条件を確認してください。';done=offer}
else if(/かな[ぁあ？?]*$/u.test(t))text='候補として考えておきましょう。メモや条件は変えていません。';
else if(t==='今日はいい天気')text='ですね。制作を再開するときに声をかけてください。';
else done=w=>w.suggest=true;
const turn={by:'ai',text:'',id};a.log.push(turn);current={turn,done};$('send').disabled=true;$('stop').hidden=false;draw(true);foot();$('stop').focus();say('応答を開始しました。');
const chars=Array.from(text);let i=0;timer=setInterval(()=>{i+=2;turn.text=chars.slice(0,i).join('');const log=$('log'),follow=log.scrollHeight-log.scrollTop-log.clientHeight<34;$('typing').textContent=turn.text;if(follow)log.scrollTop=log.scrollHeight;if(i>=chars.length)end()},45)}
$('send').onclick=send;$('input').onkeydown=e=>{if(e.key==='Enter'&&e.ctrlKey&&!e.isComposing){e.preventDefault();send()}};
function change(next){if(m===next)return;if(current)end(true);s().draft=$('input').value;$('own').value='';m=next;$('input').value=s().draft;
for(const k of ['general','adult'])$(k).setAttribute('aria-pressed',k===m);notes();tagUI();draw(true);foot();say(next==='general'?'一般向けに切り替えました。':'成人向けに切り替えました。')}
$('general').onclick=()=>change('general');$('adult').onclick=()=>adultOk?change('adult'):$('adultD').showModal();$('adOK').onclick=()=>{adultOk=true;$('adultD').close();change('adult')};
frame();notes();tagUI();draw();foot();
</script></html>
